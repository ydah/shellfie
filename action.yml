name: Shellfie Render
description: Render a Shellfie YAML config in a consistent container environment
inputs:
  input:
    description: Compose configuration path
    required: true
  output:
    description: Generated output path
    required: true
  format:
    description: Output format
    required: false
    default: png
  check:
    description: Fail when the committed output is stale without modifying it
    required: false
    default: "false"
runs:
  using: docker
  image: Dockerfile
  args:
    - generate
    - ${{ inputs.input }}
    - --output
    - ${{ inputs.output }}
    - --format
    - ${{ inputs.format }}
    - ${{ inputs.check == 'true' && '--check' || '--force' }}
branding:
  icon: terminal
  color: green

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.1"
          - os: ubuntu-latest
            ruby: "3.2"
          - os: ubuntu-latest
            ruby: "3.3"
          - os: ubuntu-latest
            ruby: "3.4"
          - os: ubuntu-latest
            ruby: "4.0"
          - os: macos-latest
            ruby: "3.4"
          - os: windows-latest
            ruby: "3.4"
          - os: ubuntu-latest
            ruby: "head"
            experimental: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install ImageMagick (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install ImageMagick (macOS)
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - name: Install ImageMagick (Windows)
        if: runner.os == 'Windows'
        run: choco install imagemagick --no-progress
      - name: Run tests
        run: bundle exec rspec
      - name: Smoke test CLI rendering
        run: |
          bundle exec ruby -Ilib exe/shellfie doctor
          bundle exec ruby -Ilib exe/shellfie validate examples/simple.yml
          bundle exec ruby -Ilib exe/shellfie inspect examples/simple.yml
          bundle exec ruby -Ilib exe/shellfie generate examples/simple.yml -o tmp/ci/simple.png --no-shadow --force
          bundle exec ruby -Ilib exe/shellfie generate examples/animation.yml -o tmp/ci/animation.gif --animate --no-shadow --force
          bundle exec ruby -Ilib exe/shf version
          bundle exec ruby -Ilib -rshellfie -e "Dir['examples/*.yml'].sort.each { |path| Shellfie.validate(path) }"
          gem build shellfie.gemspec

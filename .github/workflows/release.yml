name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Verify tag matches gem version
        run: bundle exec ruby -Ilib -rshellfie/version -e 'abort "tag must be v#{Shellfie::VERSION}" unless ENV.fetch("GITHUB_REF_NAME") == "v#{Shellfie::VERSION}"'
      - name: Test
        run: bundle exec rspec
      - name: Build gem
        run: gem build shellfie.gemspec
      - name: Attest gem provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: shellfie-*.gem
      - name: Upload gem artifact
        uses: actions/upload-artifact@v6
        with:
          name: shellfie-${{ github.ref_name }}
          path: shellfie-*.gem
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" shellfie-*.gem --verify-tag --generate-notes
